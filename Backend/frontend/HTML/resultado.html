<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del Diagnóstico - CardioCliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/app.css">
    <style>
        /* ==========================================
           Estilos Súper Premium y Coloridos
           ========================================== */
        
        /* Luces de ambiente (Neón) para dar color al fondo oscuro */
        body {
            position: relative;
            overflow-x: hidden;
            z-index: 0;
        }

        .luz-fondo-1 {
            position: absolute;
            top: -10%; left: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
        }

        .luz-fondo-2 {
            position: absolute;
            bottom: -10%; right: -10%;
            width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
        }

        /* Caja de Resultado con gradiente oscuro y borde luminoso */
        .resultado-box {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 27, 75, 0.7) 100%);
            border-radius: 20px;
            padding: 45px 20px;
            margin: 25px 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(139, 92, 246, 0.1);
            transition: all 0.5s ease;
        }

        /* Borde superior neón arcoíris */
        .resultado-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
        }

        .icon-resultado {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(236, 72, 153, 0.5));
            animation: flotar 3s ease-in-out infinite;
        }

        @keyframes flotar {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }

       #txtNivelEstres {
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.2;
    margin: 10px 0;
    background: linear-gradient(135deg, #a78bfa, #f472b6, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text; /* <--- Solución al aviso */
    -webkit-text-fill-color: transparent;
    color: transparent; /* <--- Buena práctica complementaria */
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
        #txtTipoEstres {
            font-size: 1.15rem;
            color: #cbd5e1;
            font-weight: 500;
        }

        /* Cuadrícula de Métricas a Color */
        .metricas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .metrica-item {
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: transform 0.3s ease;
        }

        .metrica-item:hover {
            transform: translateY(-5px);
        }

        /* Colores específicos para cada métrica */
        .metrica-bpm {
            background: rgba(225, 29, 72, 0.05);
            border: 1px solid rgba(225, 29, 72, 0.3);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.1);
        }
        
        .metrica-bpm .metrica-label { color: #fda4af; }
        .metrica-bpm .metrica-valor { color: #fb7185; }

        .metrica-hrv {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.1);
        }

        .metrica-hrv .metrica-label { color: #bae6fd; }
        .metrica-hrv .metrica-valor { color: #38bdf8; }

        .metrica-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .metrica-valor {
            font-size: 1.8rem;
            font-weight: 800;
        }

        /* Botones Vibrantes */
        .botones-accion {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-outline-light {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }
        
        .btn-guardar-sensor {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border: none;
            font-size: 1rem;
        }
        
        .btn-guardar-sensor:hover {
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body class="evaluacion-body">

    <!-- Luces de Neón en el Fondo -->
    <div class="luz-fondo-1"></div>
    <div class="luz-fondo-2"></div>

    <header class="evaluacion-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 1.8rem;">✨</span>
            <h2 class="titulo-pagina">Diagnóstico Inteligente</h2>
        </div>
        <button type="button" class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
    </header>

    <main class="evaluacion-container">
        <div class="tarjeta-glass-evaluacion" style="text-align: center; border-radius: 24px;">
            
            <div class="tarjeta-titulos">
                <h2 style="font-size: 1.8rem;">Análisis Completado</h2>
                <p style="color: #94a3b8;">Procesado vía Machine Learning (Random Forest)</p>
            </div>

            <div class="resultado-box">
                <div class="icon-resultado">🧠</div>
                <span style="font-size: 0.95rem; color: #38bdf8; text-transform: uppercase; font-weight: 700; letter-spacing: 1.5px;">Estado Fisiológico</span>
                <h1 id="txtNivelEstres">Procesando...</h1>
                <p id="txtTipoEstres">Analizando patrones de variabilidad cardíaca</p>
            </div>

            <div class="metricas-grid">
                <!-- Tarjeta Colorida para BPM -->
                <div class="metrica-item metrica-bpm">
                    <span class="metrica-label">❤️ BPM Promedio</span>
                    <strong class="metrica-valor" id="valBPM">--</strong>
                </div>
                <!-- Tarjeta Colorida para HRV -->
                <div class="metrica-item metrica-hrv">
                    <span class="metrica-label">⚡ Estimación HRV</span>
                    <strong class="metrica-valor" id="valHRV">Analizando</strong>
                </div>
            </div>

            <div class="botones-accion">
                <button type="button" class="btn-outline-light" onclick="window.location.href='form1.html'">
                    ↻ Nueva Evaluación
                </button>
                <button type="button" class="btn-guardar-sensor" style="flex: 1; margin: 0; padding: 16px; border-radius: 12px;" onclick="cerrarSesion()">
                    Finalizar y Guardar ✓
                </button>
            </div>

            <div id="msjResultado" class="alerta" style="margin-top: 15px; display: none;"></div>
        </div>
    </main>

    <script src="../Js/resultado.js?v=2"></script>
</body>
</html>
