{% load static %} 
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Frecuencia Cardíaca</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Sale de la carpeta HTML y entra a CSS -->
    <link rel="stylesheet" href="{% static 'CSS/login.css' %}">

</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Bienvenido</h2>
            <p>Sistema Inteligente de Frecuencia Cardíaca</p>
        </div>
        
        <form id="formularioLogin">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <div class="botones">
                <button type="submit" class="btn-primario">Iniciar Sesión</button>
                <!-- Los HTML están juntos en la misma carpeta, se llaman directo -->
                <button type="button" class="btn-secundario" onclick="window.location.href='registro.html'">Crear Cuenta</button>
            </div>
        </form>

        <div id="mensaje"></div>
    </div>

    <!-- Sale de la carpeta HTML y entra a Js -->
    <script src="{% static 'Js/login.js' %}"></script>
</body>
</html>
