<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paso 1: Datos Personales - CardioCliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/app.css">
    <style>
        /* Mejoras Premium para los Formularios Clínicos */
        .stepper-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .step.active {
            color: #4f46e5;
        }

        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .step.active .step-circle {
            background: #4f46e5;
            color: white;
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.3);
        }

        .step-line {
            width: 40px;
            height: 3px;
            background: #e2e8f0;
            border-radius: 2px;
        }

        /* Inputs con Iconos */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper span.icon {
            position: absolute;
            left: 15px;
            font-size: 1.1rem;
            color: #64748b;
            pointer-events: none;
        }

        .grupo-form input, .grupo-form select {
            padding-left: 45px !important;
        }
    </style>
</head>
<body class="admin-body">

    <!-- Menú Lateral -->
    <aside class="sidebar" aria-label="Menú de Navegación">
        <div class="sidebar-brand">
            <span class="brand-icon" aria-hidden="true">🫀</span>
            <div class="brand-text">
                <h2>CardioCliente</h2>
                <span class="brand-subtitle">Mi Perfil Inteligente</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="form1.html" class="nav-item activo">
                <span class="nav-icon">👤</span>
                <span>Datos Personales</span>
            </a>
            <a href="form2.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Estilo de Vida</span>
            </a>
            <a href="sensor.html" class="nav-item">
                <span class="nav-icon">🫀</span>
                <span>Sensor de Estrés</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button type="button" class="btn-salir-sidebar" onclick="cerrarSesion()">
                <span>🚪</span> Salir
            </button>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="top-navbar">
            <div id="indicadorRol" class="user-role-badge">
                <span class="pulse-dot"></span>
                <span>Calibración de Perfil Iniciada</span>
            </div>
            <div class="user-profile-info">
                <span class="avatar-circle">TP</span>
                <span class="user-name">Paciente Nuevo</span>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="tarjeta-panel tarjeta-perfil-centrada">
                
                <!-- Stepper Visual -->
                <div class="stepper-container">
                    <div class="step active">
                        <div class="step-circle">1</div>
                        <span>Biometría</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step">
                        <div class="step-circle">2</div>
                        <span>Hábitos</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step">
                        <div class="step-circle">3</div>
                        <span>Análisis</span>
                    </div>
                </div>

                <div class="form-header-title">
                    <h2>Datos Biométricos</h2>
                    <p class="section-desc">Ingresa tu información fisiológica básica para ajustar el algoritmo de IA.</p>
                </div>

                <form id="formPerfilPaciente" novalidate>
                    <div class="grid-formulario-dos">
                        <div class="grupo-form">
                            <label for="edad">Edad Biológica</label>
                            <div class="input-wrapper">
                                <span class="icon">🎂</span>
                                <input type="number" id="edad" placeholder="Ej. 25" required autocomplete="off">
                            </div>
                        </div>
                        <div class="grupo-form">
                            <label for="genero">Género</label>
                            <div class="input-wrapper">
                                <span class="icon">🚻</span>
                                <select id="genero" required class="select-personalizado">
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Femenino">Femenino</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="grupo-form">
                        <label for="ocupacion">Ocupación / Profesión (Contexto de Estrés)</label>
                        <div class="input-wrapper">
                            <span class="icon">💼</span>
                            <select id="ocupacion" required class="select-personalizado">
                                <option value="" disabled selected>Seleccione su área principal...</option>
                                <option value="Estudiante">Estudiante Universitario</option>
                                <option value="Ingeniero">Ingeniería / Tecnología</option>
                                <option value="Doctor">Sector Salud (Doctor/Enfermero)</option>
                                <option value="Administrativo">Sector Administrativo / Oficina</option>
                                <option value="Operativo">Trabajo Físico / Operativo</option>
                                <option value="Otro">Otro sector</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid-formulario-dos">
                        <div class="grupo-form">
                            <label for="peso">Peso (kg)</label>
                            <div class="input-wrapper">
                                <span class="icon">⚖️</span>
                                <input type="number" step="0.1" id="peso" placeholder="Ej. 70.5" required autocomplete="off">
                            </div>
                        </div>
                        <div class="grupo-form">
                            <label for="estatura">Estatura (m)</label>
                            <div class="input-wrapper">
                                <span class="icon">📏</span>
                                <input type="number" step="0.01" id="estatura" placeholder="Ej. 1.72" required autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <button type="button" onclick="window.location.href='form2.html'" class="btn-primario btn-lg" style="margin-top: 10px;">
                        Guardar y Continuar al Paso 2 ➔
                    </button>
                </form>

                <div id="msjPerfil" class="alerta" role="alert" style="display:none; margin-top: 15px;"></div>
            </div>
        </main>
    </div>

    <script src="../Js/form1.js"></script>
</body>
</html>
